<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品集展示</title>
  <style>
    /* 基础重置与平滑滚动 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      scroll-behavior: smooth;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 顶部 Header 样式 */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background-color: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
    }
    header h1 {
      font-size: 20px;
      font-weight: 700;
    }
    .badge {
      font-size: 12px;
      padding: 3px 10px;
      background-color: #004080;
      color: #3399ff;
      border-radius: 12px;
      font-weight: 600;
    }

    /* 分类吸顶锚点导航栏 */
    .category-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none; /* 隐藏滚动条 (Firefox) */
    }
    .category-nav::-webkit-scrollbar {
      display: none; /* 隐藏滚动条 (Chrome/Safari) */
    }
    .nav-item {
      color: #8e8e93;
      text-decoration: none;
      font-size: 14px;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .nav-item:hover, .nav-item.active {
      color: #ffffff;
      background: #007aff;
    }

    /* 作品内容区域 */
    main {
      padding: 16px;
    }
    .category-section {
      scroll-margin-top: 60px; /* 避免锚点跳转时被吸顶导航遮挡 */
      margin-bottom: 32px;
    }
    .category-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #e5e5ea;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .image-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .image-grid img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      background-color: #1c1c1e;
    }

    /* 加载状态提示 */
    #loading {
      text-align: center;
      padding: 40px 0;
      color: #8e8e93;
    }
  </style>
</head>
<body>

  <!-- 顶部 Header（管理模式下显示，分享模式下会自动隐藏） -->
  <header id="site-header">
    <h1>无损作品集</h1>
    <span class="badge">管理模式</span>
  </header>

  <!-- 锚点分类导航栏 -->
  <nav class="category-nav" id="category-nav">
    <a href="#cat-3d" class="nav-item">🎨 3D Visual</a>
    <a href="#cat-ui" class="nav-item">📱 UI Design</a>
    <a href="#cat-ip" class="nav-item">🧸 IP & Assets</a>
  </nav>

  <!-- 主体图片展示区 -->
  <main id="portfolio-container">
    <div id="loading">正在加载作品内容...</div>
  </main>

  <script>
    // 1. 初始化页面参数与状态
    const urlParams = new URLSearchParams(window.location.search);
    const shareId = urlParams.get('share');
    const isShareMode = !!shareId;

    // 2. 如果是分享模式，隐藏 Header 标题文字与标签
    if (isShareMode) {
      const headerElem = document.getElementById('site-header');
      if (headerElem) {
        headerElem.style.display = 'none';
      }
    }

    // 3. 从 Vercel Rewrites 代理接口获取数据
    async function fetchPortfolioData() {
      const container = document.getElementById('portfolio-container');
      
      try {
        // 构建请求路径（如果带有 shareId 则查询对应记录，否则默认获取最新）
        let apiUrl = '/sp-api/rest/v1/portfolios?select=*&order=created_at.desc&limit=1';
        if (shareId) {
          apiUrl = `/sp-api/rest/v1/portfolios?id=eq.${shareId}&select=*`;
        }

        const response = await fetch(apiUrl, {
          headers: {
            'apikey': 'sb_publishable_key_here', // 替换为你的 Supabase Publishable Key
            'Authorization': 'Bearer sb_publishable_key_here'
          }
        });

        if (!response.ok) throw new Error('数据请求失败');
        const data = await response.json();

        if (!data || data.length === 0) {
          container.innerHTML = '<div id="loading">暂无作品内容</div>';
          return;
        }

        renderPortfolio(data[0].images);
      } catch (err) {
        console.error(err);
        container.innerHTML = '<div id="loading">内容加载失败，请刷新重试</div>';
      }
    }

    // 4. 动态渲染图片分类列表
    function renderPortfolio(imagesData) {
      const container = document.getElementById('portfolio-container');
      container.innerHTML = ''; // 清空 loading

      // 假设 imagesData 数据结构支持按 category 分组，或为格式化的 JSON
      // 示例数据兼容处理：如果为纯数组直接渲染，如果包含分类则按组渲染
      if (Array.isArray(imagesData)) {
        // 兼容单组图片格式
        const section = document.createElement('section');
        section.className = 'category-section';
        section.id = 'cat-3d';
        
        const grid = document.createElement('div');
        grid.className = 'image-grid';
        
        imagesData.forEach(url => {
          const img = document.createElement('img');
          img.src = url;
          img.loading = 'lazy';
          grid.appendChild(img);
        });

        section.appendChild(grid);
        container.appendChild(section);
      } else if (typeof imagesData === 'object') {
        // 兼容多分类 JSON 格式: { "cat-3d": ["url1", "url2"], "cat-ui": ["url3"] }
        Object.keys(imagesData).forEach(catId => {
          const section = document.createElement('section');
          section.className = 'category-section';
          section.id = catId;

          const grid = document.createElement('div');
          grid.className = 'image-grid';

          imagesData[catId].forEach(url => {
            const img = document.createElement('img');
            img.src = url;
            img.loading = 'lazy';
            grid.appendChild(img);
          });

          section.appendChild(grid);
          container.appendChild(section);
        });
      }
    }

    // 启动加载
    fetchPortfolioData();
  </script>
</body>
</html>
