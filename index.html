<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>无损作品集</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      scroll-behavior: smooth;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 顶部 Header */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      background-color: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
    }
    header h1 {
      font-size: 18px;
      font-weight: 700;
    }
    .badge {
      font-size: 12px;
      padding: 3px 10px;
      background-color: #004080;
      color: #3399ff;
      border-radius: 12px;
      font-weight: 600;
    }

    /* 响应式左右布局容器 */
    .app-layout {
      display: flex;
      min-height: calc(100vh - 57px);
    }

    /* 左侧固定操作面板 */
    .admin-panel {
      width: 380px;
      flex-shrink: 0;
      background: #1c1c1e;
      border-right: 1px solid #2c2c2e;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      max-height: calc(100vh - 57px);
      position: sticky;
      top: 0;
    }

    /* 右侧预览区 */
    .preview-area {
      flex: 1;
      background: #121212;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .panel-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .panel-title {
      font-size: 13px;
      color: #8e8e93;
      font-weight: 600;
    }
    .panel-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    /* 表单控件 */
    input[type="text"], select, textarea {
      background: #2c2c2e;
      border: 1px solid #3a3a3c;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      width: 100%;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: #007aff;
    }
    textarea {
      height: 90px;
      resize: vertical;
      font-family: monospace;
    }

    /* 标签管理列表 */
    .category-manage-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .cat-tag-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .cat-tag-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cat-btn {
      background: #2c2c2e;
      border: none;
      color: #aaa;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .cat-btn:hover {
      color: #fff;
      background: #3a3a3c;
    }
    .cat-btn.del {
      color: #ff453a;
    }

    /* 按钮 */
    .btn {
      background: #007aff;
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
    }
    .btn:hover { background: #0056b3; }
    .btn-secondary {
      background: #2c2c2e;
      color: #3399ff;
      border: 1px solid #3a3a3c;
    }
    .btn-secondary:hover { background: #3a3a3c; }

    .share-url-display {
      font-size: 13px;
      color: #30d158;
      word-break: break-all;
    }

    /* 分类吸顶锚点导航栏 */
    .category-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      gap: 10px;
      padding: 12px 20px;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .category-nav::-webkit-scrollbar { display: none; }
    .nav-item {
      color: #8e8e93;
      text-decoration: none;
      font-size: 14px;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
    }
    .nav-item:hover, .nav-item.active {
      color: #ffffff;
      background: #007aff;
    }

    /* 预览区内容架构 */
    main { padding: 20px; }
    .category-section {
      scroll-margin-top: 60px;
      margin-bottom: 32px;
    }
    .category-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #e5e5ea;
    }
    .image-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    /* 拖拽卡片 */
    .image-item-wrapper {
      position: relative;
      cursor: grab;
      user-select: none;
    }
    .image-item-wrapper.dragging {
      opacity: 0.4;
    }
    .image-grid img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      background-color: #1c1c1e;
      pointer-events: none;
    }
    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 59, 48, 0.85);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    #loading {
      text-align: center;
      padding: 40px 0;
      color: #8e8e93;
    }

    /* 移动端降级垂直排列 */
    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }
      .admin-panel { width: 100%; max-height: none; position: static; }
    }
  </style>
</head>
<body>

  <!-- 顶部 Header（分享模式自动隐藏） -->
  <header id="site-header">
    <h1>无损作品集</h1>
    <span class="badge">管理模式</span>
  </header>

  <div class="app-layout">
    
    <!-- 左侧管理面板（分享模式自动隐藏） -->
    <div class="admin-panel" id="admin-panel">
      
      <!-- 1. 分类标签管理 -->
      <div class="panel-section">
        <div class="panel-title">1. 分类标签管理与排序</div>
        <div class="category-manage-list" id="cat-manage-list"></div>
        <div class="panel-row" style="margin-top: 6px;">
          <input type="text" id="new-cat-name" placeholder="新标签名称 (如: 3D Visual)" />
          <button class="btn btn-secondary" id="add-cat-btn">+ 添加</button>
        </div>
      </div>

      <!-- 2. 图片链接解析 -->
      <div class="panel-section">
        <div class="panel-title">2. 添加图片链接（多条请换行）</div>
        <textarea id="url-input" placeholder="https://example.com/image1.png&#10;https://example.com/image2.png"></textarea>
        <div class="panel-row">
          <select id="cat-select"></select>
          <button class="btn btn-secondary" id="add-urls-btn" style="width: 100%;">添加至选定分类</button>
        </div>
      </div>

      <!-- 3. 分享期限设置与保存 -->
      <div class="panel-section" style="border-top: 1px solid #2c2c2e; padding-top: 16px;">
        <div class="panel-title">3. 分享设置与生成</div>
        <div class="panel-row">
          <label style="font-size: 13px; color: #aaa;">链接有效期：</label>
          <select id="expire-select">
            <option value="7">7 天有效</option>
            <option value="30">30 天有效</option>
            <option value="0" selected>永久有效</option>
          </select>
        </div>
        
        <button class="btn" id="save-btn" style="width: 100%; font-size: 15px; padding: 10px; margin-top: 8px;">💾 保存作品集并生成链接</button>

        <div id="share-info" style="display: none; flex-direction: column; gap: 8px; margin-top: 10px;">
          <span class="share-url-display" id="share-url"></span>
          <button class="btn btn-secondary" id="copy-btn">复制分享链接</button>
        </div>
      </div>

    </div>

    <!-- 右侧实时预览/浏览区 -->
    <div class="preview-area">
      <!-- 顶部吸顶锚点导航 -->
      <nav class="category-nav" id="category-nav"></nav>
      <!-- 主体图片展区 -->
      <main id="portfolio-container">
        <div id="loading">正在加载作品内容...</div>
      </main>
    </div>

  </div>

  <script>
    const SUPABASE_API_KEY = 'sb_publishable_WlJg39rJcx_L7lO8wDG-zw_qTE4fF5o';

    const urlParams = new URLSearchParams(window.location.search);
    const shareId = urlParams.get('share');
    const isShareMode = !!shareId;

    let categories = [
      { id: 'cat-3d', name: '🎨 3D Visual' },
      { id: 'cat-ui', name: '📱 UI Design' },
      { id: 'cat-ip', name: '🧸 IP & Assets' }
    ];

    let portfolioData = {
      'cat-3d': [],
      'cat-ui': [],
      'cat-ip': []
    };

    // 1. 分享模式判定与界面控制
    if (isShareMode) {
      document.getElementById('site-header').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'none';
    }

    // 2. 渲染分类 UI（支持重命名与移位操作）
    function renderCategoryUI() {
      const navContainer = document.getElementById('category-nav');
      const selectElem = document.getElementById('cat-select');
      const manageList = document.getElementById('cat-manage-list');
      
      navContainer.innerHTML = '';
      if (selectElem) selectElem.innerHTML = '';
      if (manageList) manageList.innerHTML = '';

      categories.forEach((cat, idx) => {
        // 顶部锚点导航
        const navItem = document.createElement('a');
        navItem.className = 'nav-item';
        navItem.href = `#${cat.id}`;
        navItem.innerText = cat.name;
        navContainer.appendChild(navItem);

        // 选择下拉框
        if (selectElem) {
          const opt = document.createElement('option');
          opt.value = cat.id;
          opt.innerText = cat.name;
          selectElem.appendChild(opt);
        }

        // 标签管理列表（带重命名与左右/上下移动按键）
        if (manageList) {
          const item = document.createElement('div');
          item.className = 'cat-tag-item';
          item.innerHTML = `
            <span>${cat.name}</span>
            <div class="cat-tag-actions">
              <button class="cat-btn move-up" data-idx="${idx}">▲</button>
              <button class="cat-btn move-down" data-idx="${idx}">▼</button>
              <button class="cat-btn rename-btn" data-id="${cat.id}">✏️</button>
              <button class="cat-btn del del-cat-btn" data-id="${cat.id}">✕</button>
            </div>
          `;
          manageList.appendChild(item);
        }
      });

      // 绑定标签控制事件
      if (manageList) {
        // 向上移位
        manageList.querySelectorAll('.move-up').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const idx = parseInt(e.target.dataset.idx);
            if (idx > 0) {
              const temp = categories[idx];
              categories[idx] = categories[idx - 1];
              categories[idx - 1] = temp;
              renderCategoryUI();
              renderPortfolioContent();
            }
          });
        });

        // 向下移位
        manageList.querySelectorAll('.move-down').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const idx = parseInt(e.target.dataset.idx);
            if (idx < categories.length - 1) {
              const temp = categories[idx];
              categories[idx] = categories[idx + 1];
              categories[idx + 1] = temp;
              renderCategoryUI();
              renderPortfolioContent();
            }
          });
        });

        // 重命名
        manageList.querySelectorAll('.rename-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const catId = e.target.dataset.id;
            const targetCat = categories.find(c => c.id === catId);
            if (targetCat) {
              const newName = prompt('修改标签名称：', targetCat.name);
              if (newName && newName.trim()) {
                targetCat.name = newName.trim();
                renderCategoryUI();
                renderPortfolioContent();
              }
            }
          });
        });

        // 删除
        manageList.querySelectorAll('.del-cat-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const catId = e.target.dataset.id;
            categories = categories.filter(c => c.id !== catId);
            delete portfolioData[catId];
            renderCategoryUI();
            renderPortfolioContent();
          });
        });
      }
    }

    // 3. 添加新标签
    const addCatBtn = document.getElementById('add-cat-btn');
    if (addCatBtn) {
      addCatBtn.addEventListener('click', () => {
        const input = document.getElementById('new-cat-name');
        const name = input.value.trim();
        if (!name) return;

        const newId = 'cat-' + Date.now();
        categories.push({ id: newId, name: name });
        portfolioData[newId] = [];

        input.value = '';
        renderCategoryUI();
        renderPortfolioContent();
      });
    }

    // 4. 解析多行 URL 输入
    const addUrlsBtn = document.getElementById('add-urls-btn');
    if (addUrlsBtn) {
      addUrlsBtn.addEventListener('click', () => {
        const textarea = document.getElementById('url-input');
        const selectedCatId = document.getElementById('cat-select').value;
        const urls = textarea.value.split('\n').map(u => u.trim()).filter(u => u.length > 0);

        if (urls.length === 0) {
          alert('请先粘贴图片链接！');
          return;
        }

        if (!portfolioData[selectedCatId]) {
          portfolioData[selectedCatId] = [];
        }

        portfolioData[selectedCatId].push(...urls);
        textarea.value = '';
        renderPortfolioContent();
      });
    }

    // 5. 渲染展区与拖拽支持
    function renderPortfolioContent() {
      const container = document.getElementById('portfolio-container');
      container.innerHTML = '';

      let hasImages = false;

      categories.forEach(cat => {
        const imgList = portfolioData[cat.id] || [];
        if (isShareMode && imgList.length === 0) return;

        hasImages = true;

        const section = document.createElement('section');
        section.className = 'category-section';
        section.id = cat.id;

        const title = document.createElement('div');
        title.className = 'category-title';
        title.innerText = cat.name;
        section.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'image-grid';

        if (imgList.length === 0) {
          const emptyHint = document.createElement('div');
          emptyHint.style.color = '#48484a';
          emptyHint.style.fontSize = '13px';
          emptyHint.innerText = '暂无图片';
          grid.appendChild(emptyHint);
        } else {
          imgList.forEach((url, idx) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'image-item-wrapper';

            if (!isShareMode) {
              wrapper.draggable = true;
              wrapper.dataset.index = idx;
              wrapper.dataset.catId = cat.id;
            }

            const img = document.createElement('img');
            img.src = url;
            img.loading = 'lazy';
            wrapper.appendChild(img);

            if (!isShareMode) {
              const delBtn = document.createElement('button');
              delBtn.className = 'delete-btn';
              delBtn.innerText = '删除';
              delBtn.onclick = () => {
                portfolioData[cat.id].splice(idx, 1);
                renderPortfolioContent();
              };
              wrapper.appendChild(delBtn);
            }

            grid.appendChild(wrapper);
          });

          if (!isShareMode) {
            setupDragAndDrop(grid, cat.id);
          }
        }

        section.appendChild(grid);
        container.appendChild(section);
      });

      if (!hasImages) {
        container.innerHTML = '<div id="loading">暂无作品内容</div>';
      }
    }

    // 6. 拖拽排序逻辑
    function setupDragAndDrop(gridContainer, catId) {
      let draggedItem = null;

      gridContainer.addEventListener('dragstart', (e) => {
        if (!e.target.classList.contains('image-item-wrapper')) return;
        draggedItem = e.target;
        e.target.classList.add('dragging');
      });

      gridContainer.addEventListener('dragend', () => {
        if (!draggedItem) return;
        draggedItem.classList.remove('dragging');
        
        const items = Array.from(gridContainer.querySelectorAll('.image-item-wrapper'));
        const newUrls = items.map(item => item.querySelector('img').src);
        portfolioData[catId] = newUrls;
        
        draggedItem = null;
      });

      gridContainer.addEventListener('dragover', (e) => {
        e.preventDefault();
        const afterElement = getDragAfterElement(gridContainer, e.clientY);
        if (afterElement == null) {
          gridContainer.appendChild(draggedItem);
        } else {
          gridContainer.insertBefore(draggedItem, afterElement);
        }
      });
    }

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll('.image-item-wrapper:not(.dragging)')];
      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // 7. 加载远程数据
    async function loadPortfolioData() {
      try {
        let apiUrl = '/sp-api/rest/v1/portfolios?select=*&order=created_at.desc&limit=1';
        if (shareId) {
          apiUrl = `/sp-api/rest/v1/portfolios?id=eq.${shareId}&select=*`;
        }

        const res = await fetch(apiUrl, {
          headers: {
            'apikey': SUPABASE_API_KEY,
            'Authorization': `Bearer ${SUPABASE_API_KEY}`
          }
        });

        if (res.ok) {
          const data = await res.json();
          if (data && data[0]) {
            const record = data[0];

            if (isShareMode && record.expires_at) {
              const now = Date.now();
              const expireTime = new Date(record.expires_at).getTime();
              if (now > expireTime) {
                document.getElementById('portfolio-container').innerHTML = '<div id="loading">⚠️ 该分享链接已过期</div>';
                return;
              }
            }

            if (record.categories && Array.isArray(record.categories) && record.categories.length > 0) {
              categories = record.categories;
            }
            
            if (record.images_data && typeof record.images_data === 'object') {
              portfolioData = record.images_data;
            } else if (record.images && Array.isArray(record.images)) {
              portfolioData['cat-3d'] = record.images;
            }
          }
        }
      } catch (err) {
        console.error('加载远程数据失败', err);
      } finally {
        renderCategoryUI();
        renderPortfolioContent();
      }
    }

    // 8. 保存数据（生成分享链接，不污染管理员的 URL）
    const saveBtn = document.getElementById('save-btn');
    if (saveBtn) {
      saveBtn.addEventListener('click', async () => {
        saveBtn.innerText = '正在保存中...';
        
        const expireDays = parseInt(document.getElementById('expire-select').value);
        let expiresAt = null;
        if (expireDays > 0) {
          const expireDate = new Date();
          expireDate.setDate(expireDate.getDate() + expireDays);
          expiresAt = expireDate.toISOString();
        }

        const allImagesFlat = Object.values(portfolioData).flat();

        const payload = {
          categories: categories,
          images_data: portfolioData,
          images: allImagesFlat,
          expires_at: expiresAt
        };

        try {
          const res = await fetch('/sp-api/rest/v1/portfolios', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_API_KEY,
              'Authorization': `Bearer ${SUPABASE_API_KEY}`,
              'Prefer': 'return=representation'
            },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const errorText = await res.text();
            throw new Error(`保存失败: ${errorText}`);
          }

          const data = await res.json();
          if (data && data[0] && data[0].id) {
            const newShareId = data[0].id;
            const fullShareUrl = `${window.location.origin}${window.location.pathname}?share=${newShareId}`;
            
            document.getElementById('share-info').style.display = 'flex';
            document.getElementById('share-url').innerText = fullShareUrl;
            
            // 保持管理员原本管理链接不被改变，确保刷新依旧保留控制台
            alert('保存成功！生成的新分享链接可在下方一键复制。');
          }
        } catch (err) {
          console.error(err);
          alert(`保存失败: ${err.message}`);
        } finally {
          saveBtn.innerText = '💾 保存作品集并生成链接';
        }
      });
    }

    // 复制链接
    const copyBtn = document.getElementById('copy-btn');
    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        const urlText = document.getElementById('share-url').innerText;
        navigator.clipboard.writeText(urlText).then(() => {
          alert('链接已复制到剪贴板！');
        });
      });
    }

    // 初始化启动
    loadPortfolioData();
  </script>
</body>
</html>
